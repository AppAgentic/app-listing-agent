name: CLA Assistant

# Contributors sign CLA.md once by commenting on their pull request.
# Signatures are stored in this repository on the `cla-signatures` branch.
# Uses pull_request_target without checking out PR code, so no untrusted code runs here.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],renovate[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before we can merge it, please read our
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and sign it by commenting on this pull request with the sentence below.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
